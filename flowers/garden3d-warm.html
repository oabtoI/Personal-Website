<!doctype html>
<html lang="en">
<head>

    color: var(--ink); pointer-events: none; transition: opacity 1.6s ease; text-shadow: 0 1px 8px rgba(27,20,22,.9); }

  .err { position: fixed; inset: 0; display: grid; place-items: center; color: var(--ink); font: 14px system-ui; }
  @media (max-width: 600px) { .hud { left: 16px; top: 16px; } .hint { bottom: 22px; font-size: 10px; } }

<body>
<div class="vignette"></div>
<div class="hud"><b>Glass Garden</b>three flowers, kept by warm light</div>
<div class="hint" id="hint">move to stir the wind · touch a flower</div>

<script type="module">
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';

const V3 = THREE.Vector3, V2 = THREE.Vector2;
const MOBILE = matchMedia('(pointer: coarse)').matches || innerWidth < 760;
const REDUCE = matchMedia('(prefers-reduced-motion: reduce)').matches;
const FOG = 0.038;
const UP = new V3(0, 1, 0);
const TAU = Math.PI * 2;

function mulberry32(a) { return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

// ---------------------------------------------------------------- renderer
let renderer;
try {
  renderer = new THREE.WebGLRenderer({ antialias: false, powerPreference: 'high-performance' });
} catch (e) {
  document.body.insertAdjacentHTML('beforeend', '<div class="err">This garden needs WebGL, which your browser has turned off.</div>');
  throw e;
}
renderer.setPixelRatio(Math.min(devicePixelRatio, MOBILE ? 1.5 : 2));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x1b1416, FOG);
const camera = new THREE.PerspectiveCamera(42, innerWidth / innerHeight, 0.05, 600);
const camBase = new V3(0, 2.0, 2.3), camLook = new V3(0, 1.25, 0);

// shared uniforms: one wind field drives grass (GPU) and flowers (CPU)
const U = {
  uTime: { value: 0 },
  uWindDir: { value: new V2(0.86, -0.5).normalize() },
  uWindBase: { value: REDUCE ? 0.12 : 0.32 },
  uGust: { value: REDUCE ? 0.35 : 1.1 },
  uMouse: { value: new V2(999, 999) },
  uMouseVel: { value: new V2() },
  uFog: { value: FOG },
  uScale: { value: 800 },
};

const WIND_GLSL = /* glsl */`
uniform float uTime; uniform vec2 uWindDir; uniform float uWindBase; uniform float uGust;
uniform vec2 uMouse; uniform vec2 uMouseVel;
vec2 windAt(vec2 p, float t) {
  float along = dot(p, uWindDir);
  float s = 0.5 + 0.5 * sin(along * 0.45 - t * 1.15 + sin(p.y * 0.23 + t * 0.21) * 1.6);
  float gust = pow(s, 6.0) * (0.65 + 0.35 * sin(t * 0.13));
  float fl = sin(t * 2.1 + p.x * 1.3 + p.y * 0.7) * 0.5 + sin(t * 3.3 + p.x * 2.1 - p.y * 1.7) * 0.25;
  float mag = uWindBase * (1.0 + 0.35 * fl) + gust * uGust;
  vec2 w = uWindDir * mag + vec2(-uWindDir.y, uWindDir.x) * fl * 0.12;
  vec2 m = p - uMouse;
  w += uMouseVel * exp(-dot(m, m) / 1.4);
  return w;
}`;
// exact JS twin of windAt()
function windAt(x, z, t, out) {
  const d = U.uWindDir.value, dx = d.x, dz = d.y;
  const s = 0.5 + 0.5 * Math.sin((x * dx + z * dz) * 0.45 - t * 1.15 + Math.sin(z * 0.23 + t * 0.21) * 1.6);
  const gust = Math.pow(s, 6) * (0.65 + 0.35 * Math.sin(t * 0.13));
  const fl = Math.sin(t * 2.1 + x * 1.3 + z * 0.7) * 0.5 + Math.sin(t * 3.3 + x * 2.1 - z * 1.7) * 0.25;
  const mag = U.uWindBase.value * (1 + 0.35 * fl) + gust * U.uGust.value;
  let wx = dx * mag - dz * fl * 0.12, wz = dz * mag + dx * fl * 0.12;
  const m = U.uMouse.value, mv = U.uMouseVel.value, mx = x - m.x, mz = z - m.y;
  const fall = Math.exp(-(mx * mx + mz * mz) / 1.4);
  wx += mv.x * fall; wz += mv.y * fall;
  return out.set(wx, wz);
}

// ---------------------------------------------------------------- textures (all procedural)
function canvasTex(w, h, draw, srgb = true) {
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  draw(c.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(c);
  if (srgb) t.colorSpace = THREE.SRGBColorSpace;
  t.anisotropy = 8;
  return t;
}
function strands(c, W, H, n, style, wob = 2.5) {
  c.strokeStyle = style; c.lineWidth = 1;
  for (let i = 0; i < n; i++) {
    const x0 = (i + .5) / n * W; c.beginPath();
    for (let y = H; y >= 0; y -= 8) { const xx = x0 + Math.sin(y * .02 + i * 1.7) * wob; y === H ? c.moveTo(xx, y) : c.lineTo(xx, y); }
    c.stroke();
  }
}
function edgeFade(c, W, H, rgba, k = .18) {
  const g = c.createLinearGradient(0, 0, W, 0);
  g.addColorStop(0, rgba); g.addColorStop(k, 'rgba(0,0,0,0)'); g.addColorStop(1 - k, 'rgba(0,0,0,0)'); g.addColorStop(1, rgba);
  c.fillStyle = g; c.fillRect(0, 0, W, H);
}
const texPink = canvasTex(256, 512, (c, W, H) => {
  const g = c.createLinearGradient(0, H, 0, 0);
  g.addColorStop(0, '#fff2df'); g.addColorStop(.45, '#ffd7dd'); g.addColorStop(1, '#f6a0bd');
  c.fillStyle = g; c.fillRect(0, 0, W, H);
  edgeFade(c, W, H, 'rgba(238,104,156,.6)');
  strands(c, W, H, 72, 'rgba(255,255,255,.36)');
  c.fillStyle = 'rgba(255,120,170,.9)'; c.fillRect(0, 0, 3, H); c.fillRect(W - 3, 0, 3, H); c.fillRect(0, 0, W, 4);
});
// gold PCB traces running from the petal base toward the edge (same seed → map and glow line up)
function circuit(c, W, H, style, lw) {
  const r = mulberry32(42), k = W / 256; c.strokeStyle = style; c.fillStyle = style; c.lineWidth = lw * k; c.lineJoin = 'round'; c.lineCap = 'round';
  for (let i = 0; i < 26; i++) {
    let x = W * (.08 + .84 * r()), y = H; c.beginPath(); c.moveTo(x, y);
    const stop = H * (.04 + r() * .4);
    while (y > stop) {
      y -= (24 + r() * 60) * k; c.lineTo(x, y);
      if (y > stop && r() < .75) { const d = (r() < .5 ? -1 : 1) * (12 + r() * 30) * k; x = Math.max(8 * k, Math.min(W - 8 * k, x + d)); y -= Math.abs(d); c.lineTo(x, y); }
    }
    c.stroke();
    c.lineWidth = lw * .8 * k; c.beginPath(); c.arc(x, y, 3.5 * k, 0, TAU); c.stroke(); c.beginPath(); c.arc(x, y, 1.5 * k, 0, TAU); c.fill(); c.lineWidth = lw * k;
  }
  // chip pads and vias
  for (let i = 0; i < 5; i++) { const x = W * (.2 + .6 * r()), y = H * (.45 + .4 * r()); c.fillRect(x - 5 * k, y - 3 * k, 10 * k, 6 * k); }
  for (let i = 0; i < 40; i++) { c.beginPath(); c.arc(W * r(), H * (.15 + .8 * r()), 1.4 * k, 0, TAU); c.fill(); }
}
function leafCircuit(c, W, H, style) {
  const r = mulberry32(77); c.strokeStyle = style; c.fillStyle = style; c.lineJoin = 'miter';
  c.lineWidth = 2.4; c.beginPath(); c.moveTo(W / 2, H); c.lineTo(W / 2, 0); c.stroke();
  c.lineWidth = 1.1;
  for (let k = 1; k < 12; k++) {
    for (const side of [-1, 1]) {
      if (r() < .15) continue;
      const y0 = H * (1 - k / 12.5), d = 14 + r() * 26, end = side < 0 ? 14 + r() * 20 : W - 14 - r() * 20;
      c.beginPath(); c.moveTo(W / 2, y0); c.lineTo(W / 2 + side * d, y0 - d); c.lineTo(end, y0 - d);
      if (r() < .5) c.lineTo(end, y0 - d - 10 - r() * 20);
      c.stroke();
      const [px, py] = [end, y0 - d]; c.beginPath(); c.arc(px, py, 2.6, 0, TAU); c.stroke();
    }
  }
  for (let i = 0; i < 14; i++) { c.beginPath(); c.arc(W * (.2 + .6 * r()), H * (.1 + .8 * r()), 1.3, 0, TAU); c.fill(); }
  c.fillRect(0, 0, 3, H); c.fillRect(W - 3, 0, 3, H);
}
const texLeafTech = canvasTex(256, 512, (c, W, H) => {
  const g = c.createLinearGradient(0, H, 0, 0); g.addColorStop(0, '#4a5a40'); g.addColorStop(.6, '#7a8e68'); g.addColorStop(1, '#b8c4a8');
  c.fillStyle = g; c.fillRect(0, 0, W, H);
  leafCircuit(c, W, H, 'rgba(225,175,90,1)');
});
const texLeafTechGlow = canvasTex(256, 512, (c, W, H) => {
  c.fillStyle = '#12160e'; c.fillRect(0, 0, W, H);
  leafCircuit(c, W, H, '#ffe0a8');
});
const texPinkTech = canvasTex(512, 1024, (c, W, H) => {
  const g = c.createLinearGradient(0, H, 0, 0);
  g.addColorStop(0, '#ffd9b0'); g.addColorStop(.35, '#f1d9da'); g.addColorStop(.7, '#d9a2af'); g.addColorStop(1, '#c98a9a');
  c.fillStyle = g; c.fillRect(0, 0, W, H);
  edgeFade(c, W, H, 'rgba(142,59,82,.45)');
  strands(c, W, H, 50, 'rgba(255,255,255,.22)');
  circuit(c, W, H, 'rgba(200,140,55,1)', 1.1);
  c.fillStyle = 'rgba(220,165,80,1)'; c.fillRect(0, 0, 6, H); c.fillRect(W - 6, 0, 6, H); c.fillRect(0, 0, W, 8);
});
const texPinkTechGlow = canvasTex(512, 1024, (c, W, H) => {
  const g = c.createLinearGradient(0, H, 0, 0); g.addColorStop(0, '#5a3a24'); g.addColorStop(.4, '#5a2a34'); g.addColorStop(1, '#4a2830');
  c.fillStyle = g; c.fillRect(0, 0, W, H);
  circuit(c, W, H, '#fff0d0', 1.1);
  c.fillStyle = '#ffd9a0'; c.fillRect(0, 0, 6, H); c.fillRect(W - 6, 0, 6, H); c.fillRect(0, 0, W, 8);
});
const texLilyGlow = canvasTex(256, 512, (c, W, H) => {
  const g = c.createLinearGradient(0, H, 0, 0);
  g.addColorStop(0, '#a8642e'); g.addColorStop(.3, '#8e3b52'); g.addColorStop(.62, '#8a5a64'); g.addColorStop(1, '#a89480');
  c.fillStyle = g; c.fillRect(0, 0, W, H);
  edgeFade(c, W, H, 'rgba(255,220,190,.8)', .12);
  strands(c, W, H, 34, 'rgba(255,214,220,.35)', 1.5);
});
const texPinkGlow = canvasTex(64, 256, (c, W, H) => {
  const g = c.createLinearGradient(0, H, 0, 0);
  g.addColorStop(0, '#fff'); g.addColorStop(.5, '#7a7a7a'); g.addColorStop(1, '#151515');
  c.fillStyle = g; c.fillRect(0, 0, W, H);
});
const texLily = canvasTex(256, 512, (c, W, H) => {
  c.fillStyle = '#fff6ea'; c.fillRect(0, 0, W, H);
  edgeFade(c, W, H, 'rgba(217,162,175,.6)', .12);
  strands(c, W, H, 40, 'rgba(232,180,190,.28)', 1.5);
});
function leafDraw(c, W, H, base, vein, rim) {
  if (base) {
    const g = c.createLinearGradient(0, H, 0, 0);
    g.addColorStop(0, base[0]); g.addColorStop(1, base[1]);
    c.fillStyle = g; c.fillRect(0, 0, W, H);
  } else { c.fillStyle = '#000'; c.fillRect(0, 0, W, H); }
  c.strokeStyle = vein; c.lineWidth = 3;
  c.beginPath(); c.moveTo(W / 2, H); c.lineTo(W / 2, 0); c.stroke();
  c.lineWidth = 1.4;
  for (let k = 1; k < 11; k++) {
    const y0 = H * (k / 11.5);
    for (const side of [0, W]) {
      c.beginPath(); c.moveTo(W / 2, y0);
      c.quadraticCurveTo((W / 2 + side) / 2, y0 - H * .03, side, y0 - H * .14); c.stroke();
    }
  }
  c.lineWidth = .7; strands(c, W, H, 30, vein.replace(/[\d.]+\)$/, '.25)'), 1);
  c.fillStyle = rim; c.fillRect(0, 0, 3, H); c.fillRect(W - 3, 0, 3, H);
}
const texLeaf = canvasTex(256, 512, (c, W, H) => leafDraw(c, W, H, ['#a9b98a', '#c7d2a6'], 'rgba(232,196,120,.85)', 'rgba(232,196,120,.9)'));
const texLeafVein = canvasTex(256, 512, (c, W, H) => leafDraw(c, W, H, null, 'rgba(255,214,140,1)', 'rgba(255,214,140,1)'));
const texLeafLily = canvasTex(128, 512, (c, W, H) => {
  c.fillStyle = '#dce6d0'; c.fillRect(0, 0, W, H);
  edgeFade(c, W, H, 'rgba(150,175,130,.6)', .2);
  strands(c, W, H, 18, 'rgba(255,255,255,.3)', 1);
});
const texRadial = canvasTex(128, 128, (c, W) => {
  const g = c.createRadialGradient(W / 2, W / 2, 0, W / 2, W / 2, W / 2);
  g.addColorStop(0, 'rgba(255,255,255,1)'); g.addColorStop(.35, 'rgba(255,255,255,.35)'); g.addColorStop(1, 'rgba(255,255,255,0)');
  c.fillStyle = g; c.fillRect(0, 0, W, W);
});
const texGround = canvasTex(512, 512, (c, W, H) => {
  const r = mulberry32(3);
  c.fillStyle = '#1b241c'; c.fillRect(0, 0, W, H);
  const cols = ['#22301c', '#121a10', '#2a3420', '#1b2a18', '#2a2a1c'];
  for (let i = 0; i < 4000; i++) {
    c.fillStyle = cols[i % cols.length]; c.globalAlpha = .35 * r();
    c.beginPath(); c.arc(r() * W, r() * H, 1 + r() * 6, 0, TAU); c.fill();
  }
  c.globalAlpha = 1;
});
texGround.wrapS = texGround.wrapT = THREE.RepeatWrapping; texGround.repeat.set(36, 36);

// ---------------------------------------------------------------- sky + environment
const SUN = new V3(0.55, 0.3, -0.78).normalize();   // low sun, top right
const SKY_VS = `varying vec3 vDir; void main(){ vDir = position; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`;
const SKY_FS = /* glsl */`
varying vec3 vDir; uniform vec3 uSun; uniform float uTime; uniform float uStars;
float hash(vec3 p){ return fract(sin(dot(p, vec3(127.1, 311.7, 74.7))) * 43758.5453); }
void main(){
  vec3 d = normalize(vDir); float h = d.y;
  // near-black studio void, a breath of violet low down and a faint lift toward the key light
  vec3 col = mix(vec3(0.0105, 0.007, 0.008), vec3(0.006, 0.004, 0.0045), smoothstep(-0.2, 0.6, h));
  col += vec3(0.03, 0.013, 0.015) * exp(-abs(h) * 6.0);
  col += vec3(0.055, 0.034, 0.018) * pow(max(dot(d, uSun), 0.0), 5.0);
  gl_FragColor = vec4(col, 1.0);
}`;
function skyMesh(stars) {
  return new THREE.Mesh(new THREE.SphereGeometry(400, 48, 24), new THREE.ShaderMaterial({
    side: THREE.BackSide, depthWrite: false, fog: false,
    uniforms: { uSun: { value: SUN }, uTime: U.uTime, uStars: { value: stars } },
    vertexShader: SKY_VS, fragmentShader: SKY_FS,
  }));
}
scene.add(skyMesh(1));
{
  // reflections for the glass come from the same dusk sky, plus a few warm lanterns
  const envScene = new THREE.Scene();
  envScene.add(skyMesh(0));
  for (const [x, y, z, s, c] of [[7, 7, 1, 3, [2.6, 2.2, 1.8]], [-8, 2, 3, 2, [1.7, .7, .8]], [2, 1, -9, 2.5, [1.0, 1.0, .95]], [0, 9, 7, 1.5, [1.3, 1.1, .9]]]) {
    const m = new THREE.Mesh(new THREE.SphereGeometry(s, 12, 8), new THREE.MeshBasicMaterial({ color: new THREE.Color(...c) }));
    m.position.set(x, y, z); envScene.add(m);
  }
  const pmrem = new THREE.PMREMGenerator(renderer);
  scene.environment = pmrem.fromScene(envScene, 0.025).texture;
  scene.environmentIntensity = .6;
}

// ---------------------------------------------------------------- lights
scene.add(new THREE.HemisphereLight(0x4a3438, 0x1b1416, .22));
const key = new THREE.DirectionalLight(0xfff0dc, 1.8); key.position.set(6, 7, 2); scene.add(key);   // top right, cool white
const fill = new THREE.DirectionalLight(0xe88c9c, 0.65); fill.position.set(-6, 2, 3); scene.add(fill);
const back = new THREE.DirectionalLight(0xffd6b0, 0.8); back.position.set(1, 3, -6); scene.add(back);   // teal rim
const bedGlow = new THREE.PointLight(0xffc89a, 1.0, 4, 2); bedGlow.position.set(0, 1.5, -.9); scene.add(bedGlow);
const hoverLight = new THREE.PointLight(0xffd29a, 0, 3.2, 2); scene.add(hoverLight);

// ---------------------------------------------------------------- ground + grass
{
  // (no ground: the flowers float in a dark field)
}
function makeGrass(count) {
  // blade: 6 segments, tapering to a point, gently arched; normals rounded across the width
  const SEG = 6, pos = [], col = [], nrm = [], idx = [];
  for (let i = 0; i < SEG; i++) {
    const h = i / SEG, w = .5 * (1 - Math.pow(h, 1.4)), z = h * h * .3, c = .14 + .86 * Math.pow(h, .8);
    pos.push(-w, h, z, w, h, z); col.push(c, c, c, c, c, c);
    nrm.push(-.45, 1, .35 - h * .2, .45, 1, .35 - h * .2);
  }
  pos.push(0, 1, .3); col.push(1, 1, 1); nrm.push(0, 1, .15);
  for (let i = 0; i < SEG - 1; i++) { const a = i * 2; idx.push(a, a + 1, a + 2, a + 1, a + 3, a + 2); }
  idx.push((SEG - 1) * 2, (SEG - 1) * 2 + 1, SEG * 2);
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  geo.setAttribute('color', new THREE.Float32BufferAttribute(col, 3));
  geo.setAttribute('normal', new THREE.Float32BufferAttribute(nrm, 3));
  geo.setIndex(idx);
  const mat = new THREE.MeshStandardMaterial({ vertexColors: true, side: THREE.DoubleSide, roughness: .55, envMapIntensity: .25 });
  mat.onBeforeCompile = sh => {
    Object.assign(sh.uniforms, U, { uSunDir: { value: SUN } });
    sh.vertexShader = sh.vertexShader
      .replace('#include <common>', '#include <common>\nuniform vec3 uSunDir; varying float vSSS;\n' + WIND_GLSL)
      .replace('#include <project_vertex>', /* glsl */`
        vec4 wpos = vec4(transformed, 1.0);
        wpos = instanceMatrix * wpos;
        float bh = length(instanceMatrix[1].xyz);
        wpos = modelMatrix * wpos;
        float hh = position.y;
        vec2 base = instanceMatrix[3].xz;
        float rnd = fract(sin(dot(base, vec2(12.9898, 78.233))) * 43758.5453);
        vec2 w = windAt(base, uTime);
        vec2 off = w * (0.7 + 0.6 * rnd) * hh * hh * bh * 0.6;
        off += vec2(sin(uTime * 3.7 + rnd * 6.28), cos(uTime * 3.1 + rnd * 9.0)) * 0.012 * hh * bh * (0.4 + length(w));
        wpos.xz += off;
        wpos.y -= length(off) * 0.45 * hh;
        // light passing through the blade when you look toward the afterglow
        vSSS = pow(max(dot(normalize(wpos.xyz - cameraPosition), uSunDir), 0.0), 3.0) * hh * hh;
        vec4 mvPosition = viewMatrix * wpos;
        gl_Position = projectionMatrix * mvPosition;`);
    sh.fragmentShader = sh.fragmentShader
      .replace('#include <common>', '#include <common>\nvarying float vSSS;')
      .replace('#include <normal_fragment_begin>', '#include <normal_fragment_begin>\nnormal = normalize(vNormal);')
      .replace('#include <emissivemap_fragment>', '#include <emissivemap_fragment>\ntotalEmissiveRadiance += diffuseColor.rgb * vec3(1.8, 1.35, .7) * vSSS * 1.6;');
  };

// A stem segment bends along a circular arc of length L, turning by angle a in the vertical plane at azimuth phi.
function arc(L, a, phi) {
  const dx = Math.cos(phi), dz = Math.sin(phi), axis = new V3(dz, 0, -dx);

    if (Math.abs(a) > 1e-4) { const r = L / a; up = r * Math.sin(th); lat = r * (1 - Math.cos(th)); }
    return new V3(dx * lat, up, dz * lat);

    const th = a * t, N = new V3(dx * Math.cos(th), -Math.sin(th), dz * Math.cos(th));
    return at(t).addScaledVector(N, Math.cos(ang) * rad).addScaledVector(axis, Math.sin(ang) * rad);
  };

  return { at, quat, ring, curve, L };
}

    j.add(new THREE.Mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(cable), 36, .0016 * s, 5), M.silver));
    const beads = []; for (let q = 1; q < 5; q++) { const p = A.ring(q / 5, r * 1.9, ph + 2); beads.push(new THREE.SphereGeometry(.0032 * s, 8, 6).translate(p.x, p.y, p.z)); }
    j.add(new THREE.Mesh(mergeGeometries(beads), m.led));
    const mid = new THREE.Group(); mid.position.copy(A.at(.5)); mid.quaternion.copy(A.quat(.5)); j.add(mid);
    mid.add(new THREE.Mesh(new THREE.CylinderGeometry(r * 1.45, r * 1.45, .012 * s, 14), M.silver));
    const bolts = []; for (let q = 0; q < 4; q++) { const a = q / 4 * TAU; bolts.push(new THREE.SphereGeometry(.0025 * s, 6, 4).translate(Math.cos(a) * r * 1.5, 0, Math.sin(a) * r * 1.5)); }
    mid.add(new THREE.Mesh(mergeGeometries(bolts), M.gold));

  collar.position.copy(A.at(1)); collar.quaternion.copy(A.quat(1)); j.add(collar);

function addLeaf(f, joint, A, t, kind, m, rnd, opt) {
  const anchor = new THREE.Group(); anchor.position.copy(A.at(t)); anchor.quaternion.copy(A.quat(t)); joint.add(anchor);
  const g0 = new THREE.Group(); g0.rotation.y = opt.az; anchor.add(g0);
  const tilt = new THREE.Group(); tilt.rotation.x = opt.tilt; tilt.scale.setScalar(opt.s); g0.add(tilt);
  const S = surface(opt.surf);
  const holder = new THREE.Group(); tilt.add(holder);
  if (opt.petiole) {   // a short leaf stalk
    const pm = kind === 'peony' ? M.fiberCore : kind === 'lily' ? M.crystalStem : M.glassStem;
    const pt = new THREE.Mesh(new THREE.CylinderGeometry(.0035, .005, opt.petiole, 6), pm); pt.position.y = opt.petiole / 2; tilt.add(pt);
    holder.position.y = opt.petiole;

    const C = h => new THREE.Color(h);
    const fib = fiberSheet(S, { threads: 11, rnd, cBase: C(0x4a6a40), cMid: C(0x8aa878), cEdge: C(0xdce6d0), cTip: C(0xf3e3b9), ptA: C(0xdce6d0), ptB: C(0xf3e3b9), edgePts: 10, inPts: 2 });
    holder.add(new THREE.Mesh(sheet(S, 8, 10), new THREE.MeshBasicMaterial({ color: 0x8aa878, transparent: true, opacity: .07, blending: THREE.AdditiveBlending, depthWrite: false, side: THREE.DoubleSide })),
      new THREE.LineSegments(fib.lines, m.leafLine), new THREE.Points(fib.points, m.pts));
  } else {
    const lg = sheet(S, 10, 20), mesh = new THREE.Mesh(lg, m.leaf); holder.add(mesh);
    if (m.leafSkin) holder.add(new THREE.Mesh(lg, m.leafSkin));
    if (kind === 'camellia') {   // gold wire rim and a metal midrib
      const rim = []; for (let q = 0; q <= 24; q++) rim.push(S(-1, q / 24)); for (let q = 24; q >= 0; q--) rim.push(S(1, q / 24));
      holder.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(rim), M.goldLine));
      const rib = []; for (let q = 0; q <= 12; q++) rib.push(S(0, q / 12 * .92));
      holder.add(new THREE.Mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(rib), 16, .0022, 5), M.gold));
    }
  }
  f.leaves.push({ g0, tilt, holder, base: opt.tilt, a: 0, v: 0, az: opt.az, amp: opt.amp ?? .22, freq: 1.4 + rnd() * 1.2, ph: rnd() * TAU, k: 16 + rnd() * 8, c: 2.6 });
}

function addFlower(kind, x, z, h, seed, bloom = 1) {
  const rnd = mulberry32(seed * 9973 + 7);
  const uGlow = { value: 0 };
  const m = KIND[kind].mats(uGlow);
  const f = { kind, x, z, h, glow: 0, pulse: 0, uGlow, mats: m, joints: [], petals: [], leaves: [], yaw: rnd() * TAU, ph: rnd() * TAU };
  const s = h / 1.35;
  const root = new THREE.Group(); root.position.set(x, 0, z); scene.add(root); f.root = root;
  const nSeg = 3, L = h / nSeg;
  // a gentle S-curve, bowing mostly sideways so it reads from the front
  const phi = (rnd() < .5 ? 0 : Math.PI) + (rnd() - .5) * .7, k0 = .8 + rnd() * .5;
  const bends = [.3 * k0, -.5 * k0, .32 * k0];
  const arcs = bends.map(a => arc(L, a, phi));
  let parent = root, prev = null;
  const restAcc = new THREE.Quaternion();
  for (let i = 0; i < nSeg; i++) {
    const j = new THREE.Group(); parent.add(j);
    const rq = prev ? prev.quat(1) : new THREE.Quaternion().setFromEuler(new THREE.Euler((rnd() - .5) * .1, 0, (rnd() - .5) * .1));
    if (prev) j.position.copy(prev.at(1));
    restAcc.multiply(rq);
    f.joints.push({ g: j, rq, ax: 0, az: 0, vx: 0, vz: 0,
      flex: [.045, .075, .11][i] * (.8 + .4 * rnd()) * (h / 1.3), k: 12 + i * 6 + rnd() * 4, c: 2.6 + i * .5 });
    stemSegment(kind, j, arcs[i], i, s, m, rnd, arcs.length);
    parent = j; prev = arcs[i];
  }
  // leaves
  const J = f.joints;
  if (kind === 'lily') {
    // a fan of long blades from the base, plus two slim ones up the stem
    for (let i = 0; i < 4; i++) addLeaf(f, J[0].g, arcs[0], .32 + i * .07, kind, m, rnd, { az: phi + Math.PI / 2 + i * TAU / 4 * .9 + (rnd() - .5) * .6, tilt: .25 + rnd() * .45, s,
      surf: { len: .45 + rnd() * .35, wid: .035 + rnd() * .02, shape: 'point', fold: .35, cup: 0, bend: .25 + rnd() * .2, curl: 1.2 + rnd() * 1.2, ruffle: .004,
        twist: (rnd() < .5 ? -1 : 1) * (.5 + rnd()), asym: (rnd() - .5) * .3, skew: (rnd() - .5) * .15 }, amp: .16 });
    for (let i = 0; i < 2; i++) addLeaf(f, J[1].g, arcs[1], .5 + i * .35, kind, m, rnd, { az: phi + (i ? Math.PI : 0) + (rnd() - .5), tilt: .5 + rnd() * .3, s: s * .7,
      surf: { len: .32 + rnd() * .1, wid: .03 + rnd() * .01, shape: 'point', fold: .3, cup: 0, bend: .3, curl: 1 + rnd() * .8, ruffle: .004, twist: (rnd() - .5) * 1.6, asym: (rnd() - .5) * .3 } });
  } else {
    // 5-7 leaves spiralling up the stem, larger low down, each its own shape
    const n = 5 + Math.floor(rnd() * 3); let az = rnd() * TAU;
    for (let i = 0; i < n; i++) {
      const tt = (i + .25 + rnd() * .5) / n, T = tt * .86 * nSeg, seg = Math.min(nSeg - 1, Math.floor(T));
      az += 2.4 + (rnd() - .5) * .6;
      addLeaf(f, J[seg].g, arcs[seg], T - seg, kind, m, rnd, { az, tilt: .55 + rnd() * .6 + tt * .25, s: s * (1.15 - tt * .55), petiole: .03 + rnd() * .035,
        surf: { len: .26 + rnd() * .12, wid: .085 + rnd() * .035, shape: 'leaf', fold: .18 + rnd() * .12, cup: .08, bend: .3 + rnd() * .2, curl: .7 + rnd() * .9,
          ruffle: kind === 'peony' ? .01 : .007, rFreq: 14, serr: kind === 'peony' ? .1 : .015,
          twist: (rnd() - .5) * 1.4, asym: (rnd() - .5) * .35, skew: (rnd() - .5) * .2 } });
    }
  }
  const nod = new THREE.Group(); nod.position.copy(prev.at(1)); parent.add(nod);
  f.nod = { g: nod, rq: prev.quat(1), ax: 0, az: 0, vx: 0, vz: 0, k: 30, c: 4 };
  restAcc.multiply(f.nod.rq);
  const orient = new THREE.Group(); nod.add(orient);
  // face the head toward the viewer in world space, whatever the stem's curve did
  // aim the flower's face most of the way at the camera (a little upturned still reads as natural)
  const toCam = new V3(camBase.x - x, camBase.y - h, camBase.z - z).normalize(), face = { camellia: .38, lily: .3, peony: .55 }[kind];
  const want = new THREE.Quaternion().setFromUnitVectors(UP, UP.clone().lerp(toCam, face).normalize());
  orient.quaternion.copy(restAcc).invert().multiply(want);
  const head = new THREE.Group(); head.rotation.y = f.yaw; head.scale.setScalar(s * bloom); orient.add(head); f.head = head;
  HEADS[kind](head, f, m, rnd);
  const proxy = new THREE.Mesh(new THREE.SphereGeometry(.26, 8, 6), M.hidden); proxy.position.y = .06; proxy.userData.f = f; head.add(proxy); proxies.push(proxy);
  // a soft pool of light the flower casts on the ground
  const pool = new THREE.Mesh(new THREE.PlaneGeometry(1.7 * s, 1.7 * s), new THREE.MeshBasicMaterial({ map: texRadial, color: KIND[kind].pool, transparent: true, opacity: .05, blending: THREE.AdditiveBlending, depthWrite: false }));
  pool.rotation.x = -Math.PI / 2; pool.position.set(x, .02, z); pool.visible = false; scene.add(pool); f.pool = pool;
  flowers.push(f);
  return f;
}

// three flowers, side by side
[['peony', -.95, 1.3, 1], ['lily', 0, 1.45, 1.25], ['camellia', .95, 1.3, 1]]
  .forEach(([k, x, h, b], i) => addFlower(k, x, 0, h, i + 1, b));

// ---------------------------------------------------------------- fireflies + click sparkles
const fireflies = (() => {
  const n = 0, g = pointsGeo(n), r = mulberry32(5), data = [];
  for (let i = 0; i < n; i++) {
    data.push({ b: new V3((r() - .5) * 12, .25 + r() * 1.7, 3 - r() * 11), ph: r() * TAU, sp: .2 + r() * .4, bl: 1 + r() * 2 });
    const c = new THREE.Color(r() < .7 ? 0xffe39a : 0xd8ff9a); g.attributes.aColor.setXYZ(i, c.r * .7, c.g * .7, c.b * .7);
    g.attributes.aSize.setX(i, .018 + r() * .016); g.attributes.aSeed.setX(i, r());
  }

// dust motes: fine glitter hanging in the air, catching a soft beam of light from the top right
const dust = (() => {
  const n = 520, g = pointsGeo(n), r = mulberry32(17), c = new THREE.Color();
  const pal = [0xfff1d8, 0xfff6ea, 0xffe0b8, 0xf1d9da, 0xf3e3b9];
  for (let i = 0; i < n; i++) {
    g.attributes.position.setXYZ(i, (r() - .5) * 4.6, r(), .9 - r() * 2.6);   // y is 0..1, wrapped in the shader
    c.set(pal[Math.floor(r() * pal.length)]); g.attributes.aColor.setXYZ(i, c.r, c.g, c.b);
    g.attributes.aSize.setX(i, .0045 + r() * r() * .011); g.attributes.aSeed.setX(i, r());
  }
  const mat = new THREE.ShaderMaterial({ ...additive,
    uniforms: { uTime: U.uTime, uScale: U.uScale, uFog: U.uFog, uWind: { value: new V2() }, uMotion: { value: REDUCE ? 0 : 1 } },
    vertexShader: `attribute float aSeed, aSize; attribute vec3 aColor; uniform float uTime, uScale, uFog, uMotion; uniform vec2 uWind; varying vec3 vC; varying float vF;
    void main(){
      float t = uTime * uMotion, sd = aSeed * 6.2832;
      vec3 p = position;
      p.y = .25 + mod(p.y + t * (.006 + .012 * aSeed), 1.0) * 2.5;                 // slow rise, wrapping
      p.x += sin(t * .11 + sd) * .18 + sin(t * .37 + sd * 3.) * .04 + uWind.x * .35;
      p.z += cos(t * .09 + sd * 2.) * .14 + uWind.y * .35;
      vec4 mv = modelViewMatrix * vec4(p, 1.0); gl_Position = projectionMatrix * mv;
      // a diagonal sunbeam from the upper right: motes inside it glow, others are faint
      vec3 o = vec3(2.2, 3.4, -.6), dir = normalize(vec3(-1.0, -1.25, .55));
      vec3 q = p - o; float d = length(q - dir * dot(q, dir));

      float glint = pow(.5 + .5 * sin(uTime * (.6 + aSeed * 1.6) + sd * 7.), 6.0);   // flakes flash as they turn
      float edge = smoothstep(0., .08, mod(position.y + t * (.006 + .012 * aSeed), 1.0)) * smoothstep(1., .9, mod(position.y + t * (.006 + .012 * aSeed), 1.0));
      vC = aColor * beam * edge * (.28 + 1.1 * glint);
      gl_PointSize = max(aSize * uScale / -mv.z * (.8 + .5 * glint), 1.0);
      ${FOG_VS}
    }`, fragmentShader: PT_FS });
  const pts = new THREE.Points(g, mat); pts.frustumCulled = false; scene.add(pts);
  return mat;
})();
const sparks = (() => {
  const n = 900, g = pointsGeo(n), list = [];
  for (let i = 0; i < n; i++) list.push({ p: new V3(), v: new V3(), life: 0, d: 1 });
  g.attributes.aAlpha.array.fill(0);
  const pts = new THREE.Points(g, pointMat({ value: 0 }, 1)); pts.frustumCulled = false; scene.add(pts);
  return { g, list, next: 0 };
})();
function burst(pos, palette, n = 16) {
  const r = Math.random, c = new THREE.Color();
  for (let i = 0; i < n; i++) {
    const s = sparks.list[sparks.next], k = sparks.next; sparks.next = (sparks.next + 1) % sparks.list.length;
    s.p.copy(pos).add(new V3((r() - .5) * .15, (r() - .3) * .12, (r() - .5) * .15));
    s.v.set(r() - .5, r() * .9 - .1, r() - .5).normalize().multiplyScalar(.5 + r() * 1.2); s.v.y += .35;
    s.life = 1; s.d = 1.1 + r() * 1.6;

    sparks.g.attributes.aColor.setXYZ(k, c.r * 1.1, c.g * 1.1, c.b * 1.1);
    sparks.g.attributes.aSize.setX(k, .01 + r() * .02); sparks.g.attributes.aSeed.setX(k, r());

}

// ---------------------------------------------------------------- post
const composer = new EffectComposer(renderer, new THREE.WebGLRenderTarget(innerWidth, innerHeight, { type: THREE.HalfFloatType, samples: MOBILE ? 2 : 4 }));
composer.addPass(new RenderPass(scene, camera));

// a faint underwater shimmer: slow ripples bend the image a hair, with a whisper of colour fringing
const water = new ShaderPass({
  uniforms: { tDiffuse: { value: null }, uTime: U.uTime, uAmp: { value: REDUCE ? 0 : .0013 } },
  vertexShader: `varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`,
  fragmentShader: `uniform sampler2D tDiffuse; uniform float uTime, uAmp; varying vec2 vUv;
    void main(){
      float t = uTime * .55; vec2 uv = vUv;
      vec2 w = vec2(sin(uv.y * 17.0 + t * 1.3) + .6 * sin(uv.y * 6.0 - t * .7 + uv.x * 5.0),
                    cos(uv.x * 15.0 - t * 1.1) + .6 * sin(uv.x * 5.5 + t * .9 + uv.y * 4.0));
      uv += w * uAmp;
      vec3 col = vec3(texture2D(tDiffuse, uv + w * uAmp * .5).r, texture2D(tDiffuse, uv).g, texture2D(tDiffuse, uv - w * uAmp * .5).b);
      gl_FragColor = vec4(col, 1.0);
    }`,
});
composer.addPass(water);
composer.addPass(new OutputPass());

function resize() {
  const w = innerWidth, h = innerHeight, portrait = w / h < 1;
  camera.aspect = w / h; camera.fov = portrait ? 52 : 40;
  camLook.set(0, portrait ? 1.18 : 1.25, 0);
  camBase.set(0, portrait ? 2.13 : 2.0, portrait ? 3.8 : 2.3);
  camera.updateProjectionMatrix();
  renderer.setSize(w, h); composer.setSize(w, h); bloom.setSize(w, h);
  U.uScale.value = h * renderer.getPixelRatio() * .5 / Math.tan(THREE.MathUtils.degToRad(camera.fov / 2));
}
addEventListener('resize', resize); resize();

// ---------------------------------------------------------------- input: cursor wind + touch
const ndc = new V2(0, 0), ray = new THREE.Raycaster(), windPlane = new THREE.Plane(UP, -.5);
const hit = new V3(), prevHit = new V3(); let havePrev = false, pointerIn = false, hovered = null, moves = 0;
const hint = document.getElementById('hint');
function setPointer(e) { ndc.set(e.clientX / innerWidth * 2 - 1, -(e.clientY / innerHeight) * 2 + 1); pointerIn = true; }
function pick() {
  ray.setFromCamera(ndc, camera);
  const h = ray.intersectObjects(proxies, false)[0];
  return h ? h.object.userData.f : null;
}
addEventListener('pointermove', e => { setPointer(e); if (++moves === 40) hint.classList.add('gone'); });
addEventListener('pointerdown', e => {
  setPointer(e);
  const f = pick(); if (!f) return;
  hint.classList.add('gone');
  f.pulse = 1;
  for (const P of f.petals) P.v += (Math.random() - .25) * 5;
  for (const L of f.leaves) L.v += (Math.random() - .5) * 3;
  for (const J of f.joints) { J.vx += (Math.random() - .5) * .6; J.vz += (Math.random() - .5) * .6; }
  burst(f.head.getWorldPosition(new V3()), KIND[f.kind].spark);
});
document.addEventListener('pointerleave', () => { pointerIn = false; havePrev = false; });
addEventListener('blur', () => { pointerIn = false; havePrev = false; });

// ---------------------------------------------------------------- loop
const clock = new THREE.Clock(), w2 = new V2(), tmp = new V3(), qW = new THREE.Quaternion(), eW = new THREE.Euler();
let t = 0;
const spring = (o, key, vkey, target, k, c, dt) => { o[vkey] += (k * (target - o[key]) - c * o[vkey]) * dt; o[key] += o[vkey] * dt; };

function frame() {
  const dt = Math.min(clock.getDelta(), 1 / 30); t += dt; U.uTime.value = t;

  // camera parallax
  camera.position.set(camBase.x + ndc.x * .22, camBase.y + ndc.y * .08, camBase.z);
  camera.lookAt(camLook);

  // cursor → wind: where the pointer crosses flower height, and how fast it moves there
  const mv = U.uMouseVel.value;
  if (pointerIn) {
    ray.setFromCamera(ndc, camera);
    if (ray.ray.intersectPlane(windPlane, hit) && hit.distanceTo(camera.position) < 22) {
      if (havePrev) {
        const tx = (hit.x - prevHit.x) / dt * .4, tz = (hit.z - prevHit.z) / dt * .4, l = Math.hypot(tx, tz), cap = l > 2.6 ? 2.6 / l : 1;
        const a = 1 - Math.exp(-dt * 8); mv.x += (tx * cap - mv.x) * a; mv.y += (tz * cap - mv.y) * a;
      }
      prevHit.copy(hit); havePrev = true; U.uMouse.value.set(hit.x, hit.z);
    } else havePrev = false;
    const now = pick();
    if (now !== hovered) { hovered = now; renderer.domElement.style.cursor = now ? 'pointer' : ''; }
  } else { mv.multiplyScalar(Math.exp(-dt * 3)); if (hovered) { hovered = null; renderer.domElement.style.cursor = ''; } }

  // flowers
  let lightTarget = null, lightAmt = 0;
  for (const f of flowers) {
    const w = windAt(f.x, f.z, t, w2), wm = Math.hypot(w.x, w.y);
    for (const J of f.joints) {
      spring(J, 'ax', 'vx', w.y * J.flex, J.k, J.c, dt);
      spring(J, 'az', 'vz', -w.x * J.flex, J.k, J.c, dt);
      J.g.quaternion.copy(J.rq).multiply(qW.setFromEuler(eW.set(J.ax, 0, J.az)));
    }
    const N = f.nod, nf = Math.sin(t * 2.3 + f.ph) * wm * .035;
    spring(N, 'ax', 'vx', w.y * .1 + nf, N.k, N.c, dt);
    spring(N, 'az', 'vz', -w.x * .1 + nf * .6, N.k, N.c, dt);
    N.g.quaternion.copy(N.rq).multiply(qW.setFromEuler(eW.set(N.ax, 0, N.az)));

    f.glow += ((f === hovered ? 1 : 0) - f.glow) * (1 - Math.exp(-dt * 5));
    f.pulse *= Math.exp(-dt * 2.2);
    const G = f.glow + f.pulse * 1.6;
    for (const P of f.petals) {
      const a = P.az + f.yaw, dot = Math.sin(a) * w.x + Math.cos(a) * w.y;
      const target = wm * P.amp * (Math.sin(t * P.freq + P.ph) + .5 * Math.sin(t * P.freq * 2.3 + P.ph * 1.7)) - dot * P.push + f.glow * P.hover;
      spring(P, 'a', 'v', target, P.k, P.c, dt);
      P.tilt.rotation.x = P.base + P.a;
      P.tw.rotation.y = P.twist + Math.sin(t * P.freq * .7 + P.ph * 1.3) * wm * .08;
      P.azG.rotation.y = P.az + Math.sin(t * P.freq * .45 + P.ph * 2.1) * wm * .03;
    }
    for (const L of f.leaves) {
      const target = wm * L.amp * (Math.sin(t * L.freq + L.ph) + .4 * Math.sin(t * L.freq * 2.7 + L.ph)) + f.pulse * .1;
      spring(L, 'a', 'v', target, L.k, L.c, dt);
      L.tilt.rotation.x = L.base + L.a;
      L.holder.rotation.y = Math.sin(t * L.freq * .8 + L.ph) * wm * .35;
      L.g0.rotation.y = L.az + Math.sin(t * L.freq * .6 + L.ph * 2) * wm * .15;
    }
    for (const k in f.mats) { const mm = f.mats[k]; if (mm.userData && mm.userData.gain) mm.emissiveIntensity = mm.userData.base + G * mm.userData.gain; }
    f.uGlow.value = G;
    if (f.spin) f.spin.rotation.y += dt * (.25 + G * 1.2);
    if (f.bulbLight) {
      // slow, calm breathing — like a filament on a dimmer — brighter when touched
      const br = REDUCE ? 1 : .9 + .1 * Math.sin(t * 1.1 + f.ph) + .03 * Math.sin(t * 3.7);
      f.mats.filament.emissiveIntensity *= br;
      f.bulbLight.intensity = (.3 + G * .8) * br;
      f.halo.material.opacity = (.32 + G * .3) * br; f.halo.scale.setScalar(.13 + G * .05);
    }
    f.pool.material.opacity = .05 + G * .22;
    if (G > lightAmt) { lightAmt = G; lightTarget = f; }
  }
  if (lightTarget) lightTarget.head.getWorldPosition(tmp), hoverLight.position.lerp(tmp.setY(tmp.y + .15), lightAmt > .05 ? .25 : 1);
  hoverLight.intensity += (Math.min(lightAmt, 1.5) * 1.4 - hoverLight.intensity) * .15;

  // fireflies drift with the breeze
  const fw = windAt(0, -2, t, w2); fireflies.drift.lerp(fw, dt * .5); dust.uniforms.uWind.value.copy(fireflies.drift);
  const fp = fireflies.g.attributes.position, fa = fireflies.g.attributes.aAlpha;
  fireflies.data.forEach((d, i) => {
    const s = t * d.sp;
    fp.setXYZ(i, d.b.x + Math.sin(s + d.ph) * .7 + fireflies.drift.x * .5, d.b.y + Math.sin(s * 1.3 + d.ph * 2) * .25, d.b.z + Math.cos(s * .9 + d.ph * 3) * .7 + fireflies.drift.y * .5);
    fa.setX(i, Math.pow(.5 + .5 * Math.sin(t * d.bl + d.ph), 5));
  });
  fp.needsUpdate = fa.needsUpdate = true;

  // sparkles
  const sp = sparks.g.attributes.position, sa = sparks.g.attributes.aAlpha;
  let any = false;
  sparks.list.forEach((s, i) => {
    if (s.life <= 0) return;
    any = true;
    windAt(s.p.x, s.p.z, t, w2);
    s.v.multiplyScalar(Math.exp(-dt * 1.8)); s.v.y -= .22 * dt; s.v.x += w2.x * .8 * dt; s.v.z += w2.y * .8 * dt;
    s.p.addScaledVector(s.v, dt); s.life -= dt / s.d;
    sp.setXYZ(i, s.p.x, s.p.y, s.p.z); sa.setX(i, Math.max(0, s.life) * Math.max(0, s.life));
  });
  if (any) sp.needsUpdate = sa.needsUpdate = true;

  composer.render();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
