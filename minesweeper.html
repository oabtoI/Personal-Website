<!doctype html>
<html lang="en">
<script>if (new URLSearchParams(location.search).has('embed')) document.documentElement.classList.add('embed');</script>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Minesweeper · Arianna Liu</title>
<meta name="description" content="A pink minesweeper game.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23C67F87'/%3E%3Cpath d='M11 6v20M11 7l12 5-12 5' stroke='%23F3EDE1' stroke-width='3' fill='%23F3EDE1' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400..700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#F3EDE1;          /* site off-white */
    --ink:#37352F;            /* page text */
    --bar:#C67F87;            /* warm rose header, toward the squishy's coral pink */
    --bar-ink:#FFF8F2;
    --hide-a:#F1D9DA;         /* unopened checkers: same pink as the note boxes on the page */
    --hide-b:#EBD0D1;
    --hide-hover:#F6E4E4;
    --open-a:#FAF2E9;         /* opened checkers: warm off-whites */
    --open-b:#F2E5D9;
    --rose:#D98A92;
    --ease:cubic-bezier(0.22,1,0.36,1);
    --cell:36px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{min-height:100%;background:var(--paper);color:var(--ink);font-family:"Source Serif 4",Georgia,serif;
    -webkit-font-smoothing:antialiased}
  body{display:grid;place-items:center;min-height:100vh;min-height:100svh;padding:24px 16px}
  button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
  :focus-visible{outline:2px solid var(--rose);outline-offset:2px}

  .game{position:relative;border-radius:8px;overflow:hidden;
        user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}

  /* Header bar */
  .bar{display:flex;align-items:center;justify-content:space-between;gap:16px;height:64px;padding:0 16px;background:var(--bar);color:var(--bar-ink)}
  .level{position:relative}
  .level select{appearance:none;-webkit-appearance:none;font:inherit;font-weight:600;font-size:1rem;line-height:1.5rem;
        padding:8px 32px 8px 12px;border:0;border-radius:6px;background:var(--paper);color:var(--ink);cursor:pointer}
  .level::after{content:"";position:absolute;right:12px;top:50%;margin-top:-2px;border:5px solid transparent;border-top-color:var(--ink);pointer-events:none}
  .stats{display:flex;align-items:center;gap:24px;font-size:1.5rem;line-height:2rem;font-weight:600;font-variant-numeric:tabular-nums}
  .stat{display:flex;align-items:center;gap:8px}
  .stat svg{width:28px;height:28px;flex:none}
  .tools{display:flex;align-items:center;gap:4px}
  .icon{display:grid;place-items:center;width:40px;height:40px;border-radius:9999px;transition:background-color .3s var(--ease)}
  .icon:hover{background:rgba(255,255,255,.14)}
  .icon:active{transform:scale(.94)}
  .icon svg{width:22px;height:22px}
  .icon.flagmode[aria-pressed="true"]{background:rgba(255,255,255,.24)}
  .icon.flagmode{display:none}

  /* Board */
  .board{display:grid;grid-template-columns:repeat(var(--cols),var(--cell));grid-auto-rows:var(--cell);touch-action:manipulation;contain:layout paint}
  .c{position:relative;width:var(--cell);height:var(--cell);display:grid;place-items:center;
     font-weight:700;font-size:calc(var(--cell) * .55);line-height:1;background:var(--hide-a)}
  .c.alt{background:var(--hide-b)}
  .c.h:hover{background:var(--hide-hover)}
  .c.o{background:var(--open-a);cursor:default}
  .c.o.alt{background:var(--open-b)}
  .c.o.pop{animation:pop .28s var(--ease) both;animation-delay:var(--d,0ms)}
  @keyframes pop{from{opacity:.2;transform:scale(.6)}to{opacity:1;transform:none}}
  .c[data-n="1"]{color:#7A8DAE}.c[data-n="2"]{color:#7C9670}.c[data-n="3"]{color:#D06A78}.c[data-n="4"]{color:#8C70A0}
  .c[data-n="5"]{color:#B9805C}.c[data-n="6"]{color:#5F958F}.c[data-n="7"]{color:#5A544B}.c[data-n="8"]{color:#A39C93}
  .c svg{width:62%;height:62%;pointer-events:none}
  .c.f svg{animation:plant .3s var(--ease) both}
  @keyframes plant{from{transform:translateY(-30%) scale(.5);opacity:0}to{transform:none;opacity:1}}
  .c.boom{background:#F2A49F !important}
  .c.mine svg{animation:pop .3s var(--ease) both}

  /* End screen */
  .end{position:absolute;inset:64px 0 0;display:grid;place-items:center;background:rgba(243,237,225,.55);
       backdrop-filter:blur(2px);-webkit-backdrop-filter:blur(2px);opacity:0;visibility:hidden;transition:opacity .4s var(--ease),visibility 0s linear .4s}
  .end.on{opacity:1;visibility:visible;transition:opacity .4s var(--ease),visibility 0s}
  .card{display:flex;flex-direction:column;align-items:center;gap:16px;padding:24px 32px;border-radius:12px;background:var(--paper);
        box-shadow:0 16px 48px rgba(200,110,100,.2);text-align:center;transform:translateY(12px) scale(.98);transition:transform .5s var(--ease)}
  .end.on .card{transform:none}
  .card h2{font-size:1.5rem;line-height:2rem;font-weight:600;color:var(--bar)}
  .times{display:flex;gap:32px}
  .times div{display:flex;flex-direction:column;gap:4px}
  .times span{font-size:.75rem;line-height:1rem;font-weight:500;color:#787774;letter-spacing:.04em;text-transform:uppercase}
  .times b{font-size:1.875rem;line-height:2.25rem;font-weight:600;font-variant-numeric:tabular-nums}
  .again{padding:8px 16px;border-radius:9999px;background:var(--bar);color:var(--bar-ink);font-weight:600;font-size:1rem;line-height:1.5rem;
         transition:background-color .3s var(--ease)}
  .again:hover{background:#B5707A}
  .again:active{transform:scale(.98)}

  .hint{margin-top:16px;font-size:.875rem;line-height:1.25rem;color:#787774;text-align:center}
  .back{display:inline-block;margin-top:8px;font-size:.875rem;line-height:1.25rem;color:var(--rose)}
  .back:hover{text-decoration:underline}

  /* embedded in the me page: no page chrome, transparent, sized by the board */
  .embed,.embed body{background:transparent;min-height:0}
  .embed body{display:block;padding:0 0 8px}
  .embed main{display:flex;flex-direction:column;align-items:center}
  .embed .back{display:none}
  .embed .hint{margin-top:12px}
  @media (hover:none){ .icon.flagmode{display:grid} }
  @media (max-width:560px){
    .bar{height:56px;padding:0 8px;gap:8px}
    .end{inset:56px 0 0}
    .stats{gap:12px;font-size:1.25rem}
    .stat svg{width:22px;height:22px}
    .level select{font-size:.875rem;padding:6px 28px 6px 10px}
    .icon{width:36px;height:36px}
  }
  /* very narrow (e.g. embedded beside the squishy): compact header so it never outgrows the board */
  @media (max-width:380px){
    .bar{height:44px;padding:0 6px;gap:4px}
    .end{inset:44px 0 0}
    .stats{gap:8px;font-size:1rem;line-height:1.5rem}
    .stat{gap:4px}
    .stat svg{width:18px;height:18px}
    .tools{gap:0}
    .icon{width:30px;height:30px}
    .icon svg{width:17px;height:17px}
    .level select{font-size:.75rem;line-height:1rem;padding:4px 20px 4px 8px}
    .level::after{right:7px;border-width:4px}
    .hint{font-size:.75rem;line-height:1rem}
  }
  @media (prefers-reduced-motion:reduce){ .c.o.pop,.c.f svg,.c.mine svg{animation:none} }
</style>
</head>
<body>
<main>
  <div class="game" id="game">
    <header class="bar">
      <label class="level"><span class="sr" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)">Difficulty</span>
        <select id="level">
          <option value="easy">Easy</option>
          <option value="medium" selected>Medium</option>
          <option value="hard">Hard</option>
        </select>
      </label>
      <div class="stats">
        <div class="stat" title="Flags left"><svg viewBox="0 0 32 32" aria-hidden="true"><path d="M9 5h3v23H9z" fill="#F3EDE1"/><path d="M12 5.5 26 11l-14 6z" fill="#FCD8D5"/></svg><span id="flags" aria-label="Flags left">40</span></div>
        <div class="stat" title="Time"><svg viewBox="0 0 32 32" aria-hidden="true"><rect x="13" y="2" width="6" height="4" rx="1.5" fill="#FCD8D5"/><circle cx="16" cy="18" r="11" fill="#FCD8D5"/><circle cx="16" cy="18" r="8" fill="#F3EDE1"/><path d="M16 18V12.5M16 18l3.5 2.5" stroke="#C67F87" stroke-width="2" stroke-linecap="round"/></svg><span id="time" aria-label="Seconds">000</span></div>
      </div>
      <div class="tools">
        <button class="icon flagmode" id="flagmode" aria-pressed="false" aria-label="Flag mode"><svg viewBox="0 0 32 32" aria-hidden="true"><path d="M9 5h3v23H9z" fill="currentColor"/><path d="M12 5.5 26 11l-14 6z" fill="currentColor"/></svg></button>
        <button class="icon" id="sound" aria-pressed="true" aria-label="Sound on"><svg viewBox="0 0 24 24" aria-hidden="true"><path id="soundIcon" fill="currentColor" d="M4 9h4l5-4v14l-5-4H4zM16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></button>
        <button class="icon" id="restart" aria-label="New game"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.3-5.6M20 4v5h-5" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
      </div>
    </header>
    <div class="board" id="board" role="grid" aria-label="Minefield"></div>
    <div class="end" id="end" aria-live="polite">
      <div class="card">
        <h2 id="endTitle">You cleared it</h2>
        <div class="times"><div><span>time</span><b id="endTime">000</b></div><div><span>best</span><b id="endBest">–</b></div></div>
        <button class="again" id="again">Play again</button>
      </div>
    </div>
  </div>
  <p class="hint" id="hint">Click to dig · right click to flag · click a number to clear around it</p>
  <p style="text-align:center"><a class="back" href="index.html">back to arianna liu</a></p>
</main>

<script>
(() => {
  const LEVELS = { easy: [10, 8, 10], medium: [18, 14, 40], hard: [24, 20, 99] };   // cols, rows, mines
  const $ = id => document.getElementById(id);
  const boardEl = $('board'), flagsEl = $('flags'), timeEl = $('time'), endEl = $('end');
  const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const touch = matchMedia('(hover: none)').matches;
  if (touch) $('hint').textContent = 'Tap to dig · hold to flag (or use the flag button) · tap a number to clear around it';

  const FLAG = '<svg viewBox="0 0 32 32"><path d="M9 4h3v24H9z" fill="#A8656F"/><path d="M12 4.5 27 10.5 12 17z" fill="#E88C9C"/></svg>';
  const MINE = '<svg viewBox="0 0 32 32"><circle cx="16" cy="16" r="9" fill="#B5677A"/><circle cx="13" cy="13" r="2.6" fill="#FFC4B6"/></svg>';
  const WRONG = '<svg viewBox="0 0 32 32"><path d="M9 4h3v24H9z" fill="#A8656F"/><path d="M12 4.5 27 10.5 12 17z" fill="#E88C9C"/><path d="M6 6l20 20M26 6 6 26" stroke="#5A544B" stroke-width="3" stroke-linecap="round"/></svg>';

  let C, R, M, N, mine, adj, st, cells, started, over, opened, flags, t0, timer, level = 'medium', flagMode = false;
  // st: 0 hidden, 1 open, 2 flagged

  /* ---------- sound (tiny synthesized blips, no files) ---------- */
  let soundOn = true, ac = null;
  function blip(freq, dur = .05, type = 'sine', vol = .06){
    if (!soundOn) return;
    try {
      ac = ac || new (window.AudioContext || window.webkitAudioContext)();
      const o = ac.createOscillator(), g = ac.createGain(), t = ac.currentTime;
      o.type = type; o.frequency.setValueAtTime(freq, t); o.frequency.exponentialRampToValueAtTime(freq * .6, t + dur);
      g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
      o.connect(g).connect(ac.destination); o.start(t); o.stop(t + dur);
    } catch (e) {}
  }
  $('sound').addEventListener('click', e => {
    soundOn = !soundOn;
    e.currentTarget.setAttribute('aria-pressed', soundOn);
    e.currentTarget.setAttribute('aria-label', soundOn ? 'Sound on' : 'Sound off');
    $('soundIcon').setAttribute('d', soundOn ? 'M4 9h4l5-4v14l-5-4H4zM16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12' : 'M4 9h4l5-4v14l-5-4H4zM16 9l5 6M21 9l-5 6');
  });

  /* ---------- best times ---------- */
  const bestKey = () => `ms-best-${level}`;
  const getBest = () => { try { return +localStorage.getItem(bestKey()) || 0; } catch (e) { return 0; } };
  const setBest = v => { try { localStorage.setItem(bestKey(), v); } catch (e) {} };

  /* ---------- setup ---------- */
  const embed = document.documentElement.classList.contains('embed');
  function sizeCells(){
    const maxW = Math.min(innerWidth - (embed ? 0 : 32), 900), maxH = embed ? Infinity : innerHeight - 200;
    const cell = Math.max(embed ? 12 : 18, Math.min(40, Math.floor(maxW / C), Math.floor(maxH / R)));
    document.documentElement.style.setProperty('--cell', cell + 'px');
    if (typeof postHeight === 'function') postHeight();
  }
  function newGame(){
    [C, R, M] = LEVELS[level]; N = C * R;
    mine = new Uint8Array(N); adj = new Uint8Array(N); st = new Uint8Array(N);
    started = false; over = false; opened = 0; flags = 0;
    clearInterval(timer); timeEl.textContent = '000';
    flagsEl.textContent = M;
    endEl.classList.remove('on');
    boardEl.style.setProperty('--cols', C);
    const frag = document.createDocumentFragment();
    cells = new Array(N);
    for (let i = 0; i < N; i++){
      const b = document.createElement('button');
      const r = (i / C) | 0, c = i % C;
      b.className = 'c h' + ((r + c) % 2 ? ' alt' : '');
      b.dataset.i = i;
      b.setAttribute('aria-label', `Row ${r + 1}, column ${c + 1}, hidden`);
      cells[i] = b; frag.appendChild(b);
    }
    boardEl.replaceChildren(frag);
    sizeCells();
    postHeight();
  }
  addEventListener('resize', sizeCells);
  // tell the page that embeds us how tall we are, so its frame fits exactly
  function postHeight(){
    if (embed && parent !== window) parent.postMessage({ type: 'ms-height', h: Math.ceil(document.body.getBoundingClientRect().height) }, '*');
  }
  if (embed && parent !== window){ new ResizeObserver(postHeight).observe(document.body); addEventListener('load', postHeight); }

  function neighbors(i){
    const r = (i / C) | 0, c = i % C, out = [];
    for (let dr = -1; dr <= 1; dr++) for (let dc = -1; dc <= 1; dc++){
      if (!dr && !dc) continue;
      const rr = r + dr, cc = c + dc;
      if (rr >= 0 && rr < R && cc >= 0 && cc < C) out.push(rr * C + cc);
    }
    return out;
  }

  // first click always opens an empty area: no mines on it or around it
  function placeMines(safe){
    const banned = new Set([safe, ...neighbors(safe)]);
    const pool = [];
    for (let i = 0; i < N; i++) if (!banned.has(i)) pool.push(i);
    for (let k = 0; k < M; k++){
      const j = k + ((Math.random() * (pool.length - k)) | 0);
      [pool[k], pool[j]] = [pool[j], pool[k]];
      mine[pool[k]] = 1;
    }
    for (let i = 0; i < N; i++) if (!mine[i]) adj[i] = neighbors(i).reduce((t, n) => t + mine[n], 0);
  }

  function startClock(){
    started = true; t0 = performance.now();
    timer = setInterval(() => {
      const s = Math.min(999, ((performance.now() - t0) / 1000) | 0);
      timeEl.textContent = String(s).padStart(3, '0');
    }, 250);
  }

  /* ---------- moves ---------- */
  function openArea(start){
    // flood fill without recursion; store distance so the reveal ripples outward
    const stack = [[start, 0]], batch = [];
    while (stack.length){
      const [i, d] = stack.pop();
      if (st[i] !== 0) continue;
      st[i] = 1; opened++; batch.push([i, d]);
      if (adj[i] === 0) for (const n of neighbors(i)) if (st[n] === 0 && !mine[n]) stack.push([n, d + 1]);
    }
    for (const [i, d] of batch){
      const el = cells[i];
      el.className = 'c o pop' + (el.classList.contains('alt') ? ' alt' : '');
      if (!reduced) el.style.setProperty('--d', Math.min(d * 22, 420) + 'ms');
      if (adj[i]){ el.textContent = adj[i]; el.dataset.n = adj[i]; }
      el.setAttribute('aria-label', adj[i] ? `${adj[i]} mines around` : 'empty');
    }
    return batch.length;
  }

  function dig(i){
    if (over || st[i] !== 0) return;
    if (!started){ placeMines(i); startClock(); }
    if (mine[i]) return lose(i);
    const n = openArea(i);
    blip(n > 1 ? 520 : 680, n > 1 ? .09 : .045);
    checkWin();
  }

  function toggleFlag(i){
    if (over || st[i] === 1) return;
    const el = cells[i];
    if (st[i] === 2){ st[i] = 0; flags--; el.classList.remove('f'); el.innerHTML = ''; el.setAttribute('aria-label', 'hidden'); }
    else { st[i] = 2; flags++; el.classList.add('f'); el.innerHTML = FLAG; el.setAttribute('aria-label', 'flagged'); }
    flagsEl.textContent = M - flags;
    blip(st[i] === 2 ? 880 : 440, .06, 'triangle', .05);
  }

  // clicking an opened number whose flags are all placed clears the rest around it
  function chord(i){
    if (over || st[i] !== 1 || !adj[i]) return;
    const ns = neighbors(i);
    if (ns.filter(n => st[n] === 2).length !== adj[i]) return;
    let opened_ = 0;
    for (const n of ns) if (st[n] === 0){
      if (mine[n]) return lose(n);
      opened_ += openArea(n);
    }
    if (opened_){ blip(560, .08); checkWin(); }
  }

  function checkWin(){
    if (opened !== N - M) return;
    over = true; clearInterval(timer);
    const secs = Math.min(999, Math.round((performance.now() - t0) / 1000));
    timeEl.textContent = String(secs).padStart(3, '0');
    for (let i = 0; i < N; i++) if (mine[i] && st[i] !== 2){ st[i] = 2; cells[i].classList.add('f'); cells[i].innerHTML = FLAG; }
    flagsEl.textContent = 0;
    const best = getBest(); const nb = !best || secs < best;
    if (nb) setBest(secs);
    $('endTitle').textContent = nb && best ? 'New best time' : 'You cleared it';
    $('endTime').textContent = String(secs).padStart(3, '0');
    $('endBest').textContent = String(nb ? secs : best).padStart(3, '0');
    [660, 880, 1100].forEach((f, k) => setTimeout(() => blip(f, .12, 'sine', .05), k * 110));
    setTimeout(() => { endEl.classList.add('on'); $('again').focus({preventScroll:true}); }, reduced ? 0 : 500);
  }

  function lose(hit){
    over = true; clearInterval(timer);
    cells[hit].className += ' o boom mine'; cells[hit].innerHTML = MINE;
    blip(120, .35, 'sawtooth', .07);
    const rest = [];
    for (let i = 0; i < N; i++){
      if (mine[i] && i !== hit && st[i] !== 2) rest.push(i);
      if (!mine[i] && st[i] === 2){ cells[i].innerHTML = WRONG; }
    }
    // mines appear nearest first, all within about a second
    const hr = (hit / C) | 0, hc = hit % C;
    rest.sort((a, b) => Math.hypot(((a / C) | 0) - hr, a % C - hc) - Math.hypot(((b / C) | 0) - hr, b % C - hc));
    const step = reduced ? 0 : Math.min(40, 1000 / Math.max(1, rest.length));
    rest.forEach((i, k) => setTimeout(() => {
      const el = cells[i]; el.className = el.className.replace(' h', '') + ' mine'; el.innerHTML = MINE;
    }, k * step));
    $('endTitle').textContent = 'Boom. Try again?';
    $('endTime').textContent = timeEl.textContent;
    const best = getBest(); $('endBest').textContent = best ? String(best).padStart(3, '0') : '–';
    setTimeout(() => { endEl.classList.add('on'); $('again').focus({preventScroll:true}); }, reduced ? 0 : rest.length * step + 500);
  }

  /* ---------- input (one listener for the whole board) ---------- */
  let pressTimer = null, longPressed = false;
  const idx = e => { const b = e.target.closest('.c'); return b ? +b.dataset.i : -1; };

  boardEl.addEventListener('click', e => {
    const i = idx(e); if (i < 0) return;
    if (longPressed){ longPressed = false; return; }
    if (st[i] === 1) chord(i);
    else if (flagMode || e.shiftKey) toggleFlag(i);
    else if (st[i] === 0) dig(i);
  });
  boardEl.addEventListener('contextmenu', e => {
    e.preventDefault();
    const i = idx(e); if (i < 0) return;
    if (st[i] === 1) chord(i); else toggleFlag(i);
  });
  // hold to flag on touch screens
  boardEl.addEventListener('pointerdown', e => {
    if (e.pointerType !== 'touch') return;
    const i = idx(e); if (i < 0) return;
    longPressed = false;
    pressTimer = setTimeout(() => { longPressed = true; toggleFlag(i); navigator.vibrate?.(15); }, 350);
  });
  ['pointerup', 'pointercancel', 'pointerleave'].forEach(ev => boardEl.addEventListener(ev, () => clearTimeout(pressTimer)));
  // keyboard: arrows move, Enter/Space digs, F flags
  boardEl.addEventListener('keydown', e => {
    const i = idx(e); if (i < 0) return;
    const r = (i / C) | 0, c = i % C;
    const move = { ArrowUp: [-1, 0], ArrowDown: [1, 0], ArrowLeft: [0, -1], ArrowRight: [0, 1] }[e.key];
    if (move){
      e.preventDefault();
      const rr = Math.max(0, Math.min(R - 1, r + move[0])), cc = Math.max(0, Math.min(C - 1, c + move[1]));
      cells[rr * C + cc].focus();
    } else if (e.key === 'f' || e.key === 'F'){ e.preventDefault(); st[i] === 1 ? chord(i) : toggleFlag(i); }
  });

  $('flagmode').addEventListener('click', e => {
    flagMode = !flagMode; e.currentTarget.setAttribute('aria-pressed', flagMode);
