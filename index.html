<!doctype html>
<html lang="en">
<head>

<meta name="description" content="Arianna Liu. Projects, art and more.">
<meta property="og:title" content="Arianna Liu">
<meta property="og:description" content="Projects, art and more.">

<script>try{document.documentElement.dataset.theme=localStorage.getItem('theme')==='light'?'light':'dark'}catch(e){document.documentElement.dataset.theme='dark'}</script>
<style>
  :root{
    --cream:#F3EDE1;        /* off white paper, from the Go with the Flow poster */
    --glow:255,206,160;     /* warm light, from the Light poster */
    --line:rgba(243,237,225,.42);
    --bg:#1b1416;
    --serif:ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI Variable Display","Segoe UI",Helvetica,Arial,sans-serif;   /* Notion's default face; everything but the name uses it */
    --ease:cubic-bezier(0.22,1,0.36,1);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;background:#000;color:var(--cream);overflow:hidden;
    font-family:var(--serif);-webkit-font-smoothing:antialiased}
  a,button{color:inherit;font:inherit;text-decoration:none;background:none;border:0;cursor:pointer}
  :focus-visible{outline:1px solid var(--cream);outline-offset:6px;border-radius:2px}

  .stage{position:fixed;inset:0;overflow:hidden;touch-action:none;background:#000}
  .stage canvas{position:absolute;inset:0;width:100%;height:100%;display:block;opacity:0;transition:opacity 1.6s var(--ease)}
  body.gl-ready .stage canvas{opacity:1}
  .stage canvas{mix-blend-mode:screen}
  body.in-garden .stage canvas{pointer-events:none}
  /* the garden stays full screen; its own camera pans in step with this one, so nothing gets cut at an edge */
  #gardenFrame{position:absolute;inset:0;width:100%;height:100%;border:0;display:block;background:#000;visibility:hidden}
  body.sheet-open #gardenFrame{pointer-events:none}

  /* Hairline frame */
  .frame{position:absolute;inset:24px;border:1px solid var(--line);pointer-events:none;opacity:0;transition:opacity 1.6s var(--ease)}
  .frame i{position:absolute;width:4px;height:4px;background:var(--cream);opacity:.8}
  .frame i:nth-child(1){left:-2.5px;top:-2.5px}.frame i:nth-child(2){right:-2.5px;top:-2.5px}
  .frame i:nth-child(3){left:-2.5px;bottom:-2.5px}.frame i:nth-child(4){right:-2.5px;bottom:-2.5px}

  /* Title block */
  .title{position:absolute;inset:0 0 0 46%;display:flex;flex-direction:column;align-items:center;justify-content:center;
         text-align:center;pointer-events:none;transform:translateX(calc(var(--pan,0) * 100vw))}
  @media (max-aspect-ratio:17/20){ .title{inset:56% 0 0 0;justify-content:flex-start} }
  .float{display:flex;flex-direction:column;align-items:center;gap:8px;
         animation:hover 7s cubic-bezier(0.45,0,0.55,1) infinite alternate;will-change:transform}
  @keyframes hover{from{transform:translateY(-4px)}to{transform:translateY(6px)}}

  .spark{width:24px;height:24px;color:#fff;filter:drop-shadow(0 0 6px rgba(var(--glow),.9)) drop-shadow(0 0 16px rgba(var(--glow),.6));
         opacity:0;transform:scale(.3) rotate(-90deg);transition:opacity 1.2s var(--ease),transform 1.6s var(--ease)}
  body.ready .spark{opacity:1;transform:none;animation:twinkle 3.2s cubic-bezier(0.45,0,0.55,1) 2s infinite alternate}
  @keyframes twinkle{from{transform:scale(1) rotate(0)}to{transform:scale(.72) rotate(45deg)}}

  /* The name: three stacked layers make it look lit from inside.
     ::before = wide warm halo, ::after = hot white core, text = cream fill with a light sweep. */
  .name{--near:0;--lx:0;--ly:0;position:relative;font-family:Yellowtail,cursive;font-weight:400;
        font-size:clamp(3.5rem,9vw,8.5rem);line-height:1.02;padding:0 24px 8px;white-space:nowrap;color:var(--cream);
        clip-path:inset(-60% 100% -60% -10%);transition:clip-path 2.2s var(--ease)}
  .name .l2{display:block;padding-left:1.7em}
  .name .cap{font-family:Ballet,cursive;font-optical-sizing:auto;font-weight:400;font-size:1.1em;line-height:0;margin-right:-.06em}
  /* Ballet only ships one thin weight, so an outline in the same colour thickens its strokes to match Yellowtail */
  .name .cap{-webkit-text-stroke:.02em currentColor;paint-order:stroke fill}
  .name .fill .cap{-webkit-text-stroke-color:var(--cream);-webkit-text-stroke-width:.034em}   /* .02em plus what the thinning filter removes */
  .name .fill{filter:url(#thin)}   /* Yellowtail has one weight; this shaves its strokes a little */
  .name .fill{position:relative;z-index:1;display:inline-block;padding:.4em .35em;margin:-.4em -.35em;   /* room for swashes that overhang the letter boxes */

        background:linear-gradient(100deg,var(--cream) 0%,var(--cream) 42%,#FFFFFF 50%,var(--cream) 58%,var(--cream) 100%);
        background-size:300% 100%;background-position:100% 0;-webkit-background-clip:text;background-clip:text;color:transparent}
  .name .halo,.name .core{position:absolute;inset:0;padding:inherit;pointer-events:none;z-index:0}
  .name .halo{color:rgb(var(--glow));filter:blur(22px);
        opacity:calc(.55 + var(--near) * .4);
        transform:translate(calc(var(--lx) * -14px), calc(var(--ly) * -8px)) scale(1.02);
        transition:opacity .5s var(--ease),transform .5s var(--ease)}
  .name .core{color:#FFF6EA;filter:blur(5px);opacity:.55}
  body.ready .name{clip-path:inset(-60% -10% -60% -10%)}
  body.ready .name .fill{animation:sweep 7s cubic-bezier(0.45,0,0.55,1) 2.6s infinite}
  body.ready .name .core{animation:breathe 4.5s cubic-bezier(0.45,0,0.55,1) 2.2s infinite alternate}
  @keyframes sweep{0%{background-position:100% 0}45%,100%{background-position:0% 0}}
  @keyframes breathe{from{opacity:.22}to{opacity:.45}}   /* soft, so the colours in the letters stay readable */

  .links{display:flex;align-items:center;gap:16px;font-family:var(--serif);font-size:1.5rem;line-height:2rem;
         pointer-events:auto;text-shadow:0 0 8px rgba(var(--glow),.85),0 0 24px rgba(var(--glow),.55),0 1px 2px rgba(40,20,10,.35)}
  .links a{position:relative;padding:4px 0;opacity:0;transform:translateY(16px);
           transition:opacity 1s var(--ease),transform 1s var(--ease),color .3s var(--ease)}
  .links a::after{content:"";position:absolute;left:0;right:0;bottom:2px;height:1px;background:currentColor;
                  box-shadow:0 0 8px rgba(var(--glow),.9);transform:scaleX(0);transform-origin:left;transition:transform .5s var(--ease)}
  .links a:hover{color:#fff}
  .links a:hover::after,.links a:focus-visible::after{transform:scaleX(1)}
  .links a:active{transform:scale(.98)}
  .links .sep{opacity:0;transition:opacity 1s var(--ease)}
  .links.social{font-size:1rem;line-height:1.5rem;gap:20px;margin-top:-4px}
  .links.social a{opacity:0}
  body.ready .links.social a{opacity:.8}
  body.ready .links.social a:hover{opacity:1}

  /* explore the garden (left) / home (right): outline triangles from the sketch */
  .way{position:fixed;z-index:12;top:50%;display:flex;align-items:center;gap:12px;padding:8px;color:var(--cream);
       font-family:var(--serif);font-style:normal;font-size:1.125rem;line-height:1.5rem;text-align:left;
       text-shadow:0 0 8px rgba(var(--glow),.8),0 0 20px rgba(var(--glow),.45);opacity:0;transition:opacity 1.2s var(--ease) 1.6s}
  body.ready .way{opacity:1}
  .way svg{width:28px;height:32px;flex:none;filter:drop-shadow(0 0 4px rgba(var(--glow),.8));transition:transform .5s var(--ease)}
  .way:active{opacity:.8}
  .explore{left:32px;transform:translate(calc(var(--pan,0) * 100vw),-50%)}
  .explore:hover svg{transform:translateX(-6px)}
  .homebtn{right:32px;top:auto;bottom:28px;transform:translateX(calc((var(--pan,0) - 1) * 100vw));text-align:right}
  .homebtn:hover svg{transform:translateX(6px)}
  .gtitle{position:fixed;z-index:12;left:64px;top:40px;font:400 clamp(2rem,4.5vw,3rem)/1.2 var(--serif);letter-spacing:-.01em;color:var(--cream);
          text-shadow:0 0 18px rgba(var(--glow),.55),0 0 2px rgba(var(--glow),.7);pointer-events:none;
          transform:translateX(calc((var(--pan,0) - 1) * 100vw))}
  .glabel{position:fixed;z-index:12;left:0;top:0;display:flex;align-items:center;gap:8px;padding:6px 10px;color:var(--cream);
          font-family:var(--serif);font-style:normal;font-size:1.25rem;line-height:1.75rem;white-space:nowrap;
          text-shadow:0 0 8px rgba(var(--glow),.8),0 0 20px rgba(var(--glow),.45);
          opacity:clamp(0, calc((var(--pan,0) - .7) * 3.4), 1);transition:color .3s var(--ease)}
  .glabel svg{width:14px;height:14px;transition:transform .4s var(--ease)}
  .glabel:hover,.glabel.lit{color:#fff}
  .glabel:hover svg,.glabel.lit svg{transform:translateY(3px)}
  body:not(.in-garden) .glabel{pointer-events:none}
  @media (max-width:640px){
    .explore{left:12px}.homebtn{right:12px}.gtitle{left:24px;top:28px}
    .way{font-size:1rem;line-height:1.25rem}
    .glabel{font-size:1rem}
  }
  @media (max-aspect-ratio:17/20){
    .explore{top:32px;left:16px;transform:translate(calc(var(--pan,0) * 100vw),0)}
    .homebtn{bottom:16px;right:12px}
  }
  body.ready .links a,body.ready .links .sep{opacity:1;transform:none}
  body.ready .frame{opacity:1}

  /* Corner controls */
  .corner{position:fixed;z-index:30;bottom:40px;display:flex;align-items:center;gap:8px;padding:8px 12px;will-change:transform;
          font-family:var(--serif);font-size:1rem;line-height:1.5rem;color:var(--cream);
          background:rgba(24,16,12,.38);border-radius:9999px;
          text-shadow:0 0 8px rgba(var(--glow),.8),0 0 18px rgba(var(--glow),.45);
          transition:opacity .3s var(--ease),background-color .3s var(--ease)}
  .corner:hover{background:rgba(24,16,12,.55)}
  .corner:active{opacity:.8}
  .skip{transition:opacity .5s var(--ease),transform .5s var(--ease),background-color .3s var(--ease)}
  .zoom{right:40px;opacity:0;pointer-events:none}
  .zoom svg{width:16px;height:16px}
  .corner .rule{width:24px;height:1px;background:currentColor;box-shadow:0 0 6px rgba(var(--glow),.9);transition:transform .5s var(--ease);transform-origin:left}
  .corner:hover .rule{transform:scaleX(1.4)}
  .skip .arrow{width:16px;height:16px;filter:drop-shadow(0 0 4px rgba(var(--glow),.8));transition:transform .5s var(--ease)}
  .skip:hover .arrow{transform:translateX(4px)}
  .mute{left:40px}
  .skip{right:40px}
  .skip.gone{opacity:0;pointer-events:none;transform:translateY(8px)}
  .bars{display:inline-flex;align-items:flex-end;gap:2px;height:12px}
  .bars span{width:2px;height:3px;background:currentColor;transform-origin:bottom;box-shadow:0 0 4px rgba(var(--glow),.9)}
  body.sound .bars span{animation:eq 1.1s cubic-bezier(0.45,0,0.55,1) infinite alternate}
  body.sound .bars span:nth-child(2){animation-delay:-.4s}body.sound .bars span:nth-child(3){animation-delay:-.75s}
  @keyframes eq{from{transform:scaleY(1)}to{transform:scaleY(3.6)}}

  @media (max-width:640px){
    .frame{inset:16px}
    .links{font-size:1.25rem;gap:12px}
    .corner{bottom:24px}
    .mute{left:24px}.skip,.zoom{right:24px}
  }
  @media (prefers-reduced-motion:reduce){
    .float,body.ready .name .fill,body.ready .name .core,body.ready .spark{animation:none}
    .name{transition:none}
    .links a,.spark{transform:none!important}
  }

  /* ---------- Notion style pages ---------- */
  :root{--banner:28vh;--paper:#F3EDE1;--text:#37352F;--text-2:#787774;--rule:rgba(55,53,47,.13);--hover:rgba(55,53,47,.05)}
  .sheet{position:fixed;left:0;right:0;bottom:0;height:calc(100% - var(--banner));z-index:20;background:var(--paper);color:var(--text);
         font-family:var(--serif);transform:translate3d(0,100%,0);overflow-y:auto;overscroll-behavior:contain;visibility:hidden;will-change:transform}
  .sheet.on{visibility:visible}
  /* a margin of paper that stays put under the banner, so scrolled content fades out instead of being cut */
  .sheet{--gutter:48px}
  .sheet::before{content:"";position:sticky;top:0;display:block;height:var(--gutter);margin-bottom:calc(var(--gutter) * -1);
                 z-index:5;pointer-events:none;background:var(--paper)}
  .sheet:focus{outline:none}
  .page{max-width:1080px;margin:0 auto;padding:var(--gutter) var(--gutter) 96px}
  .page.swap{animation:swap .6s var(--ease)}
  @keyframes swap{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
  .crumbs{display:flex;gap:8px;align-items:center;color:var(--text-2);font-size:.875rem;line-height:1.25rem;margin-bottom:24px}
  .crumbs a{border-radius:4px;padding:2px 4px;margin:-2px -4px;transition:background-color .3s var(--ease),color .3s var(--ease)}
  .crumbs a:hover{background:var(--hover);color:var(--text)}
  .ptitle{font-size:2.25rem;line-height:2.5rem;font-weight:600;letter-spacing:-.01em;margin-bottom:16px;text-wrap:balance}
  .ptitle:focus{outline:none}
  .ptitle .orn{color:#C98A9A;font-weight:400}
  .quote{border-left:3px solid #D9A2AF;padding:2px 0 2px 16px;color:#8A6B4E;font-style:normal;font-size:1rem;line-height:1.5rem;margin-bottom:40px;text-wrap:pretty}
  .cols{display:grid;grid-template-columns:200px minmax(0,1fr);gap:40px;align-items:start}
  .side{display:flex;flex-direction:column;gap:16px;position:sticky;top:var(--gutter)}
  .box{background:var(--hover);border-radius:8px;padding:16px}
  .box h3{font-size:.875rem;line-height:1.25rem;font-weight:600;font-style:normal;margin-bottom:8px}
  .box nav a{display:block;padding:4px 8px;margin:0 -8px;border-radius:4px;font-size:.875rem;line-height:1.25rem;color:var(--text-2);
             transition:background-color .3s var(--ease),color .3s var(--ease)}
  .box nav a:hover{background:var(--hover);color:var(--text)}
  .box nav a[aria-current]{color:var(--text);background:rgba(55,53,47,.08)}
  .note{background:#F1D9DA;border-radius:8px;padding:12px 16px;font-size:.875rem;line-height:1.25rem;color:#5D3A42;text-wrap:pretty}
  .dbhead{display:flex;align-items:center;justify-content:space-between;gap:16px;border-bottom:1px solid var(--rule);padding-bottom:8px;margin-bottom:16px}
  .dbhead h3{font-size:1.25rem;line-height:1.75rem;font-weight:600}
  .view{display:inline-flex;gap:4px;align-items:center;font-size:.875rem;line-height:1.25rem;color:var(--text-2);padding:2px 8px;border-radius:4px;background:var(--hover)}
  .gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:16px}
  .card{display:flex;flex-direction:column;border:1px solid var(--rule);border-radius:8px;overflow:hidden;background:var(--paper);
        box-shadow:0 1px 2px rgba(55,53,47,.06);transition:transform .5s var(--ease),box-shadow .3s var(--ease)}
  a.card:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(55,53,47,.12)}
  a.card:active{transform:scale(.98)}
  .card .cover{aspect-ratio:16/10;object-fit:cover;width:100%;display:block;background:var(--hover)}
  .card .body{padding:12px;display:flex;flex-direction:column;gap:8px}
  .card .t{font-size:1rem;line-height:1.5rem;font-weight:500}
  .card .d{font-size:.875rem;line-height:1.25rem;color:var(--text-2);text-wrap:pretty}
  .tag{align-self:flex-start;font-family:var(--serif);font-size:.75rem;line-height:1rem;padding:2px 8px;border-radius:4px}
  .tag.pink{background:#F1D9DA;color:#8E3B52}.tag.yellow{background:#F3E3B9;color:#7A5A12}
  .tag.green{background:#DCE6D0;color:#3F5A2E}.tag.blue{background:#D9E2EA;color:#2F4E68}
  .hint{display:grid;place-items:center;min-height:160px;border:1px dashed var(--rule);border-radius:8px;color:var(--text-2);
        font-size:.875rem;line-height:1.25rem;padding:16px;text-align:center}
  .art{columns:3 200px;column-gap:16px}
  .art figure{break-inside:avoid;margin:0 0 16px}
  .art img{width:100%;display:block;border-radius:8px;border:1px solid var(--rule)}
  .art figcaption{display:flex;justify-content:space-between;gap:8px;padding:8px 2px 0;font-size:.875rem;line-height:1.25rem}
  .art figcaption span:last-child{color:var(--text-2)}
  .collage{position:relative}
  .piece{position:absolute}
  .piece .in{display:block;width:100%;height:100%;padding:0;overflow:hidden;border-radius:4px;background:var(--hover);cursor:zoom-in}
  .piece .in:active img{transform:scale(.98)}
  .piece img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .7s var(--ease)}
  .piece:hover img{transform:scale(1.03)}
  .props{display:grid;grid-template-columns:140px 1fr;border-top:1px solid var(--rule);margin-bottom:32px}
  .props dt,.props dd{padding:8px 0;border-bottom:1px solid var(--rule);font-size:.875rem;line-height:1.25rem}
  .props dt{color:var(--text-2)}
  .prose p{font-size:1rem;line-height:1.75rem;margin-bottom:16px;max-width:640px;text-wrap:pretty}
  .quotes{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px;margin-top:32px}
  .h2{font-size:1.25rem;line-height:1.75rem;font-weight:600;margin:40px 0 12px}
  /* squishy up on the left, minesweeper lower on the right; columns sized so the cube and the board match */
  .play{display:grid;grid-template-columns:minmax(0,4fr) minmax(0,3fr);gap:24px;align-items:start;margin-top:40px}
  .play{position:relative}
  .sticker{position:absolute;left:0;top:0;z-index:3;height:var(--h);padding:0;border-radius:24px;cursor:grab;touch-action:none;
           transform:translate(var(--x,0),var(--y,0)) rotate(var(--r,0deg));
           filter:drop-shadow(0 1px 1px rgba(90,50,40,.18)) drop-shadow(0 6px 12px rgba(90,50,40,.14));
           transition:transform .35s var(--ease),filter .35s var(--ease)}
  .sticker img{display:block;height:100%;width:100%;pointer-events:none;user-select:none;-webkit-user-select:none}
  .sticker:hover{transform:translate(var(--x,0),var(--y,0)) rotate(var(--r,0deg)) scale(1.04)}
  .sticker.dragging{cursor:grabbing;transition:filter .35s var(--ease);
           transform:translate(var(--x,0),var(--y,0)) rotate(calc(var(--r,0deg) * .5)) scale(1.1);
           filter:drop-shadow(0 2px 2px rgba(90,50,40,.16)) drop-shadow(0 18px 28px rgba(90,50,40,.22))}
  .sticker:focus-visible{outline:2px solid #C98A9A;outline-offset:4px}
  /* petting: a contented wiggle while stroked, a squish when patted, little hearts */
  .sticker img{transform-origin:50% 90%}
  .sticker.petting img{animation:purr .46s cubic-bezier(0.45,0,0.55,1) infinite}
  .sticker.pat img{animation:pat .45s var(--ease)}
  @keyframes purr{0%,100%{transform:none}50%{transform:scale(1.035,.965) rotate(1.2deg)}}
  @keyframes pat{0%{transform:none}35%{transform:scale(1.08,.9)}70%{transform:scale(.97,1.04)}100%{transform:none}}
  .heart{position:absolute;z-index:60;width:20px;height:20px;margin:-10px 0 0 -10px;pointer-events:none;
         animation:heart 1s var(--ease) forwards}
  .heart svg{width:100%;height:100%;fill:#E88C9C;filter:drop-shadow(0 1px 2px rgba(150,80,90,.25))}
  @keyframes heart{0%{opacity:0;transform:scale(calc(var(--s) * .4))}
                   20%{opacity:1}
                   100%{opacity:0;transform:translate(var(--dx),-70px) rotate(var(--rot)) scale(var(--s))}}
  @media (prefers-reduced-motion:reduce){
    .sticker.petting img,.sticker.pat img{animation:none}
    @keyframes heart{0%{opacity:0}20%{opacity:1}100%{opacity:0}}
  }
  .squishy{display:block;width:100%;aspect-ratio:1;margin-top:-24px;border:0;background:transparent;color-scheme:normal}
  .mines{display:block;width:100%;margin:96px 0 0;height:420px;border:0;background:transparent;color-scheme:normal}
  /* Full screen art viewer */
  .lightbox{position:fixed;inset:0;z-index:50;display:grid;place-items:center;padding:64px 80px;
            background:rgba(20,14,12,.88);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
            opacity:0;visibility:hidden;transition:opacity .4s var(--ease),visibility 0s linear .4s}
  .lightbox.on{opacity:1;visibility:visible;transition:opacity .4s var(--ease),visibility 0s}
  .lightbox img{max-width:100%;max-height:calc(100vh - 128px);object-fit:contain;border-radius:4px;
            box-shadow:0 24px 80px rgba(0,0,0,.5);transform:scale(.96);transition:transform .5s var(--ease),opacity .25s var(--ease)}
  .lightbox.on img{transform:none}
  .lightbox img.fade{opacity:0}

  function layoutCollage(){
    const el = document.getElementById('collage'); if (!el) return;

      p.style.cssText = `left:${x}px;top:${y}px;width:${w}px;height:${h}px`; };
    const rowOf = (ids, x0, y0, width) => {           // pieces side by side, same height, filling width exactly
      const ids2 = ids.filter(id => node[id]); if (!ids2.length) return 0;
      const h = (width - G * (ids2.length - 1)) / ids2.reduce((t, id) => t + ar[id], 0);
      let x = x0;

  /* ---------- Pointer: the name glows toward the cursor, the title drifts a little ---------- */

  });
  addEventListener('pointermove', e => onMove(e.clientX, e.clientY));
  document.addEventListener('pointerleave', () => { par.tx = par.ty = 0; });
  let lastPar = '';
  function frame(){
    requestAnimationFrame(frame);
    par.x += (par.tx - par.x) * .06; par.y += (par.ty - par.y) * .06;
    const pt = `translate3d(${par.x.toFixed(1)}px, ${par.y.toFixed(1)}px, 0)`;
    if (pt !== lastPar){ parEl.style.transform = pt; lastPar = pt; }
  }
  requestAnimationFrame(frame);
  route();
})();
</script>
